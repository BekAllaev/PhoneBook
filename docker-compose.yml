services:
  postgres:
    image: postgres:17
    container_name: ekospol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ekospol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ekospol"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates Keycloak's database on first start. A script in /docker-entrypoint-initdb.d
  # would only run on an empty volume, so this also covers an existing postgres-data volume.
  keycloak-db-init:
    image: postgres:17
    container_name: ekospol-keycloak-db-init
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ekospol
    command:
      - sh
      - -c
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 || psql -c "CREATE DATABASE keycloak"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: ekospol-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Keep realms, users and sessions in Postgres instead of the container's dev H2 database.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HEALTH_ENABLED: "true"
      # Browser-facing URL; tokens are issued for it. Back-channel calls from other
      # containers (http://keycloak:8080) keep their own host.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/ekospol-realm.json:/opt/keycloak/data/import/ekospol-realm.json:ro
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    # build:
    #   context: ./src
    #   dockerfile: EkospolTest.Backend/Dockerfile
    image: bekallaev/phonebook-api:1.0
    container_name: ekospol-backend
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ekospol;Username=postgres;Password=postgres
      Keycloak__Authority: http://localhost:8080/realms/ekospol
      Keycloak__MetadataAddress: http://keycloak:8080/realms/ekospol/.well-known/openid-configuration
    ports:
      - "5274:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    # build:
    #   context: ./src/EkospolTest.Frontend
    image: bekallaev/phonebook-web:1.0
    container_name: ekospol-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
