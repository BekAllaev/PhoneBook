<form class="add-form" (ngSubmit)="add()">
  <input name="number" [(ngModel)]="number" placeholder="+420 123 456 789" required />
  <label>
    <input type="checkbox" name="isPublic" [(ngModel)]="isPublic" />
    Veřejné
  </label>
  <button type="submit" [disabled]="!number.trim()">Přidat</button>
</form>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Číslo</th>
      <th>Veřejné</th>
      <th>Vlastník</th>
    </tr>
  </thead>
  <tbody>
    @for (phoneNumber of phoneNumbers(); track phoneNumber.id) {
      <tr>
        <td>{{ phoneNumber.number }}</td>
        <td>{{ phoneNumber.isPublic ? 'Ano' : 'Ne' }}</td>
        <td>{{ phoneNumber.ownerUsername }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">Zatím nejsou žádná čísla.</td>
      </tr>
    }
  </tbody>
</table>
